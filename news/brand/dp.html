<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&display=swap" rel="stylesheet">
<style>*{margin:0}body{width:800px;height:800px;overflow:hidden}.d{position:absolute;inset:0;display:none}</style></head><body>
<!-- A: merge graph, light -->
<div class="d" id="A" style="background:radial-gradient(500px 500px at 80% 10%,#DCE7FF,transparent 65%),#F5F8FA">
<svg width="800" height="800" viewBox="-45 0 800 800">
  <path d="M280 170 L280 630" stroke="#0F172A" stroke-width="58" stroke-linecap="round" fill="none"/>
  <path d="M520 220 C520 420, 280 400, 280 520" stroke="#2563EB" stroke-width="58" stroke-linecap="round" fill="none"/>
  <circle cx="280" cy="170" r="70" fill="#F5F8FA" stroke="#0F172A" stroke-width="40"/>
  <circle cx="520" cy="220" r="70" fill="#F5F8FA" stroke="#2563EB" stroke-width="40"/>
  <circle cx="280" cy="630" r="82" fill="#2563EB"/>
  <circle cx="280" cy="630" r="34" fill="#fff"/>
</svg></div>
<!-- B: MR monogram tile -->
<div class="d" id="B" style="background:#2563EB">
<svg width="800" height="800" viewBox="0 0 800 800" style="position:absolute;left:0;top:0">
  <path d="M600 150 C600 300, 470 300, 470 430" stroke="rgba(255,255,255,.28)" stroke-width="34" stroke-linecap="round" fill="none"/>
  <circle cx="600" cy="150" r="40" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="22"/>
</svg>
<div style="position:absolute;left:0;right:0;top:250px;text-align:center;font:900 330px/1 'Inter Tight';letter-spacing:-8px;color:#fff">MR</div>
<div style="position:absolute;left:310px;top:600px;width:180px;height:24px;border-radius:12px;background:#0F172A"></div>
</div>
<!-- C: dark, merge graph + pulse dot -->
<div class="d" id="C" style="background:radial-gradient(520px 520px at 50% 40%,#1E3A8A 0%,#0F172A 70%)">
<svg width="800" height="800" viewBox="0 0 800 800">
  <path d="M250 200 L400 380 L550 200" stroke="#93B4FF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M400 380 L400 610" stroke="#fff" stroke-width="46" stroke-linecap="round" fill="none"/>
  <circle cx="250" cy="200" r="54" fill="#0F172A" stroke="#93B4FF" stroke-width="30"/>
  <circle cx="550" cy="200" r="54" fill="#0F172A" stroke="#93B4FF" stroke-width="30"/>
  <circle cx="400" cy="610" r="74" fill="#2563EB" stroke="#fff" stroke-width="22"/>
</svg></div>
</body></html>
